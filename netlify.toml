[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/admin-session"
  status = 200

[[redirects]]
  from = "/api/admin/password"
  to = "/.netlify/functions/admin-password"
  status = 200

[[redirects]]
  from = "/api/admin/resumes"
  to = "/.netlify/functions/admin-resumes"
  status = 200

[[redirects]]
  from = "/api/admin/settings"
  to = "/.netlify/functions/admin-settings"
  status = 200

[[redirects]]
  from = "/api/admin/contacts"
  to = "/.netlify/functions/admin-contacts"
  status = 200

[[redirects]]
  from = "/api/public-settings"
  to = "/.netlify/functions/public-settings"
  status = 200

[[redirects]]
  from = "/api/resume"
  to = "/.netlify/functions/public-resume"
  status = 200

# Real app routes only — /admin is the SPA shell; everything else is a static file
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Genuine 404 for unknown paths (kills scanner false positives; SPA has no router paths)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://avatars.githubusercontent.com; frame-src 'self' https://*.vercel.app https://*.netlify.app; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'"
    Cross-Origin-Opener-Policy = "same-origin"

# Fresh HTML on every visit; hash-named assets cache for a year (immutable)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
