<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page not found | Nayan Dhurve</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(129, 140, 248, 0.08), transparent 26rem), #0a0a0c;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #818cf8, #a78bfa, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    .message { margin: 1.2rem 0 2.2rem; color: #a1a1aa; font-size: 1rem; }
    .link {
      display: inline-block;
      color: #fff;
      background: #6366f1;
      padding: 0.7rem 1.6rem;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .link:hover { background: #818cf8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p class="message">This page doesn't exist on this site.</p>
    <a class="link" href="/">← Back to home</a>
  </div>
</body>
</html>
